<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Deepgram Sapat workflow in Daytona</title>
  <desc id="desc">A workflow from local recordings to a Daytona workspace, Sapat conversion, Deepgram transcription, and transcript review.</desc>
  <rect width="1280" height="720" fill="#f7faf9"/>
  <rect x="70" y="82" width="1140" height="556" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
  <text x="112" y="145" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#102a43">Sapat + Deepgram inside Daytona</text>
  <text x="112" y="188" font-family="Arial, sans-serif" font-size="22" fill="#486581">Repeatable transcription workflow for existing video and audio files</text>
  <g font-family="Arial, sans-serif">
    <rect x="112" y="260" width="180" height="128" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="202" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#0c4a6e">Recordings</text>
    <text x="202" y="345" text-anchor="middle" font-size="18" fill="#0c4a6e">MP4 files</text>
    <text x="202" y="370" text-anchor="middle" font-size="18" fill="#0c4a6e">or folders</text>
    <rect x="368" y="260" width="180" height="128" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
    <text x="458" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">Daytona</text>
    <text x="458" y="345" text-anchor="middle" font-size="18" fill="#14532d">clean Python</text>
    <text x="458" y="370" text-anchor="middle" font-size="18" fill="#14532d">workspace</text>
    <rect x="624" y="260" width="180" height="128" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="714" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#7c2d12">Sapat</text>
    <text x="714" y="345" text-anchor="middle" font-size="18" fill="#7c2d12">convert to MP3</text>
    <text x="714" y="370" text-anchor="middle" font-size="18" fill="#7c2d12">select provider</text>
    <rect x="880" y="260" width="180" height="128" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="970" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#312e81">Deepgram</text>
    <text x="970" y="345" text-anchor="middle" font-size="18" fill="#312e81">Listen API</text>
    <text x="970" y="370" text-anchor="middle" font-size="18" fill="#312e81">Nova model</text>
    <path d="M300 324h58" stroke="#334e68" stroke-width="5" stroke-linecap="round"/>
    <path d="M348 306l22 18-22 18" fill="none" stroke="#334e68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M556 324h58" stroke="#334e68" stroke-width="5" stroke-linecap="round"/>
    <path d="M604 306l22 18-22 18" fill="none" stroke="#334e68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M812 324h58" stroke="#334e68" stroke-width="5" stroke-linecap="round"/>
    <path d="M860 306l22 18-22 18" fill="none" stroke="#334e68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="298" y="474" width="684" height="88" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <text x="640" y="514" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Transcript output</text>
    <text x="640" y="548" text-anchor="middle" font-size="18" fill="#475569">review, archive, or feed into downstream AI workflows</text>
    <path d="M970 392v42c0 40-36 40-74 40H384c-38 0-74 0-74 40v0" fill="none" stroke="#334e68" stroke-width="5" stroke-linecap="round"/>
